# ICT Multi-Timeframe Trading System Configuration

system:
  log_level: INFO
  log_file: logs/ict_system.log
  signal_output_path: signals/active   # directory; one JSON per symbol
  performance_log: logs/performance.csv   # legacy/compat – same as signals_log
  signals_log: logs/signals.csv           # Layer 2: published signals
  candidates_log: logs/candidates.csv     # Layer 1: valid analysis setups
  executions_log: logs/executions.csv     # Layer 3: confirmed EA executions
  rejections_log: logs/rejections.csv     # Layer 3: EA-side rejections
  execution_feedback_dir: signals/feedback # EA writes JSON feedback here
  scan_interval_seconds: 60

mt5:
  host: "localhost"
  port: 18812
  login: 0              # Set your MT5 account login
  password: ""          # Set your MT5 account password
  server: ""            # Set your broker server name

symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - XAUUSD

timeframes:
  macro: D1
  structure: H1
  entry: M5
  supported: [M1, M5, M15, H1, H4, D1]

data:
  source: mt5           # mt5 | csv
  csv_path: data/csv/
  sqlite_path: data/ict_data.db
  candle_history: 500   # candles to fetch per timeframe

strategy:
  atr_period: 14
  atr_multiplier: 1.5   # displacement threshold multiplier
  swing_lookback: 2     # candles each side for swing detection
  equal_level_pips: 3   # pip threshold for equal highs/lows
  fib_swing_lookback: 50
  ob_search_window: 10  # max candles to search backward from displacement for OB candle
  disp_search_window: 6 # max candles to search backward from BOS for displacement candle
  london_killzone_open: 7    # UTC hour – London Killzone opens (Setup 3)
  london_killzone_close: 10  # UTC hour – London Killzone closes (Setup 3)
  killzone_bos_lookback: 3   # H1 BOS must be within this many candles for Setup 3

# Confluence scoring weights – tune against backtests without changing code
scoring:
  bias_alignment: 0.20      # D1 + H1 trend alignment bonus
  correct_zone: 0.15        # price is in the correct Fib zone (discount/premium)
  wrong_zone_penalty: 0.30  # deduction when price is in the wrong Fib zone
  h1_ob: 0.20               # active H1 order block present
  h1_fvg: 0.15              # active H1 fair-value gap present
  m5_sweep: 0.20            # recent M5 liquidity sweep confirmed
  m5_fvg: 0.10              # active M5 fair-value gap present
  min_valid_score: 0.50     # minimum score required to mark a setup as valid

# Hard gates that must ALL pass before any scoring takes place.
# These are enforced inside each playbook; this block documents the rules.
required_conditions:
  d1_bias_alignment: true          # Setup 1: D1 + H1 trend must agree
  d1_ob_presence: true             # Setup 2: price must be at an active D1 Order Block
  london_killzone_time: true        # Setup 3: must be inside London Killzone window
  h1_confirmation_required: true   # all setups: H1 BOS or sweep must confirm direction
  m5_liquidity_sweep_required: true # all setups: M5/H1 sweep must be present
  min_rr_required: true            # minimum R:R enforced before emitting any signal

# Symbol-aware pip sizes: keys are substrings matched against the symbol name.
# The first matching key wins; "default" is the fallback.
pip_sizes:
  default: 0.0001   # standard 5-digit forex (EURUSD, GBPUSD, …)
  JPY: 0.01         # 3-digit JPY pairs (USDJPY, EURJPY, …)
  XAU: 0.10         # gold (XAUUSD)
  XAG: 0.01         # silver (XAGUSD)

risk:
  risk_percent: 1.0           # % account risk per trade
  max_daily_loss_percent: 3.0
  max_trades_per_day: 5
  max_spread_pips: 3.0
  max_slippage_pips: 2.0
  trading_hours:              # UTC hours
    london_open: 8
    london_close: 17
    ny_open: 13
    ny_close: 22

signal:
  min_confidence: 0.65        # minimum confidence score to emit signal
  min_risk_reward: 2.0
  spread_pips: 1.0            # typical spread in pips; used to compute cost-adjusted R:R

ml:
  enabled: false
  model_path: ml/models/xgb_filter.pkl
  confidence_threshold: 0.65

integration:
  mode: file            # file | http | socket
  http_host: "127.0.0.1"  # localhost-only by default; set to 0.0.0.0 if binding to all interfaces
  http_port: 5000
  http_workers: 2       # Gunicorn worker processes
  socket_host: "0.0.0.0"
  socket_port: 9999
  signal_ttl_seconds: 300     # signal expires after N seconds
  api_key: ""           # Set a non-empty secret to require X-API-Key on /signal endpoints
  # Security hardening (Issue 12)
  ip_allowlist: []      # e.g. ["127.0.0.1", "10.0.0.5"]; empty list = allow all
  hmac_secret: ""       # Set to a long random string to require HMAC-SHA256 signatures on POST
  nonce_window_seconds: 300   # reject replay of nonces seen within this window

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

# Backtest export mode (Issue 10)
backtest:
  output_dir: backtests/signals   # JSONL files written here
  data_source: csv                # csv | mt5
