name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 is Windows-only; exclude it and install the rest
          grep -v 'MetaTrader5' requirements.txt > /tmp/requirements_ci.txt
          pip install -r /tmp/requirements_ci.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check python/ tests/ scripts/ --select E,W,F --ignore E501
        continue-on-error: true   # lint failures are advisory, not blocking

      - name: Run tests
        run: python -m pytest tests/ -q
